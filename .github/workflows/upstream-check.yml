name: upstream-check

# Weekly drift check: compares every pinned workspace ref in
# scripts/regen-registry.py against its upstream (default-branch head, or the
# newest kelvin release for urbit). When anything is stale it does the
# mechanical part of the upgrade runbook -- bump the refs, regenerate
# registry.toml, validate -- and opens (or refreshes) a single PR from the
# `upstream-bump` branch. Merging stays a human step: new upstream imports need
# a deliberate include/skip decision, so the PR body carries the changelog and
# any generator warnings, and the PR is a draft if anything needs attention.
# A tracking issue labelled `upstream-drift` links to the PR and closes itself
# once every pin is current.

on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write        # push the upstream-bump branch
  pull-requests: write   # open / update the bump PR
  issues: write          # tracking issue
  actions: write         # dispatch registry.yml on the bump branch

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  outdated:
    runs-on: ubuntu-latest
    steps:
      # Always work from master (a manual dispatch from another branch must not
      # leak that branch's commits into the bump PR), with history so we can
      # tell bot commits on upstream-bump from a maintainer's.
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compare pins against upstream
        id: check
        run: |
          set +e
          python3 scripts/regen-registry.py outdated --markdown --exit-code > report.md
          code=$?
          set -e
          cat report.md
          case $code in
            0) echo "stale=false" >> "$GITHUB_OUTPUT" ;;
            10) echo "stale=true" >> "$GITHUB_OUTPUT" ;;
            *) exit $code ;;
          esac

      # Mechanical upgrade (runbook steps 1-4). Problems here do not stop the
      # job; they are reported in the PR body and make the PR a draft.
      - name: Bump stale pins and regenerate
        id: bump
        if: steps.check.outputs.stale == 'true'
        run: |
          git switch -C upstream-bump
          python3 scripts/regen-registry.py outdated --bump > /dev/null
          set +e
          python3 scripts/regen-registry.py generate --check > changelog.txt 2> check.err
          python3 scripts/regen-registry.py generate 2> generate.err
          gen=$?
          set -e
          grep -h '^warning: ' check.err generate.err | sort -u > warnings.txt || true
          # generate exits 1 when it wrote the file but had warnings; anything
          # else non-zero (or 1 with no warnings) means it did not finish.
          ok=true
          if [ $gen -ne 0 ] && ! { [ $gen -eq 1 ] && [ -s warnings.txt ]; }; then
            ok=false
            { echo "generate exited $gen:"; cat generate.err; } > errors.txt
          elif git diff --quiet -- registry.toml; then
            ok=false
            echo "generate succeeded but registry.toml did not change" > errors.txt
          fi
          if [ "$ok" = true ] && python3 scripts/regen-registry.py validate > validate.txt 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
          touch validate.txt errors.txt
          if [ -s warnings.txt ]; then echo "warned=true"; else echo "warned=false"; fi >> "$GITHUB_OUTPUT"
          cat changelog.txt warnings.txt errors.txt validate.txt

      - name: Open or update bump PR
        id: pr
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VALID: ${{ steps.bump.outputs.valid }}
          WARNED: ${{ steps.bump.outputs.warned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare/master...upstream-bump?expand=1
        run: |
          bot="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git config user.email "$bot"
          pr=$(gh pr list --head upstream-bump --state open --json url --jq '.[0].url // empty')

          # If a maintainer has pushed to upstream-bump (e.g. include/skip
          # decisions), leave the branch alone and just point at it.
          if git rev-parse -q --verify refs/remotes/origin/upstream-bump >/dev/null &&
             git log --format=%ae origin/master..origin/upstream-bump | grep -qvxF "$bot"; then
            echo "upstream-bump has maintainer commits; not overwriting"
            echo "url=${pr:-$COMPARE_URL}" >> "$GITHUB_OUTPUT"
            [ -n "$pr" ] && gh pr comment "$pr" --body "Upstream moved again ([run]($RUN_URL)); not touching this branch because it has maintainer commits." 
            exit 0
          fi

          git add scripts/regen-registry.py registry.toml
          bumped=$(git diff --cached -U0 scripts/regen-registry.py | grep -c '^+ *"ref"' || true)
          git commit -q -m "Bump stale upstream pins" -m "Automated by upstream-check: $RUN_URL"
          # Push only when the content differs from what is already there, so
          # an unchanged PR keeps its reviews and checks.
          if git rev-parse -q --verify refs/remotes/origin/upstream-bump >/dev/null &&
             git diff --quiet origin/upstream-bump HEAD; then
            echo "upstream-bump already has this content"
            pushed=false
          else
            git push --force-with-lease=upstream-bump origin upstream-bump
            pushed=true
          fi

          {
            echo "Automated bump of ${bumped} pinned workspace ref(s) to upstream head ([run]($RUN_URL))."
            echo
            cat report.md
            echo
            echo "### Registry changelog (\`generate --check\` against master)"
            echo '```'; cat changelog.txt; echo '```'
            if [ -s errors.txt ]; then
              echo
              echo "### :x: Generator error"
              echo '```'; cat errors.txt; echo '```'
            fi
            if [ "$WARNED" = "true" ]; then
              echo
              echo "### :warning: Generator warnings: decide include/skip before merging"
              echo '```'; cat warnings.txt; echo '```'
            fi
            echo
            if [ "$VALID" = "true" ]; then
              echo "### \`validate\`: passed"
            else
              echo "### :x: \`validate\`: FAILED or not run"
            fi
            echo '```'; cat validate.txt; echo '```'
            echo
            echo "Before merging: read the warnings, update the README status line if \`nockchain\` or \`urbit\` moved,"
            echo "and smoke-test with Nockup after merge (CONTRIBUTING.md → Upgrade runbook, step 5)."
            echo "To make include/skip edits, push commits to \`upstream-bump\`; the workflow stops rewriting the branch once it has non-bot commits."
          } > pr.md

          draft=()
          if [ "$VALID" != "true" ] || [ "$WARNED" = "true" ]; then draft=(--draft); fi
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file pr.md
            if [ ${#draft[@]} -gt 0 ]; then gh pr ready "$pr" --undo || true
            else gh pr ready "$pr" || true; fi
          elif ! pr=$(gh pr create --base master --head upstream-bump \
                        --title "Bump stale upstream pins" --body-file pr.md "${draft[@]}"); then
            pr="$COMPARE_URL"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::Could not open the bump PR (is Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests' on?). Branch pushed: $COMPARE_URL"
          fi
          echo "url=$pr" >> "$GITHUB_OUTPUT"

          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so
          # run the registry gate on the bump branch explicitly.
          if [ "$pushed" = true ] && ! gh workflow run registry.yml --ref upstream-bump; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "::error::Could not dispatch registry.yml on upstream-bump"
          fi

      - name: Update tracking issue
        if: always() && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.check.outputs.stale }}
          PR_URL: ${{ steps.pr.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create upstream-drift --color FBCA04 \
            --description "Pinned upstream ref lags upstream" --force
          issue=$(gh issue list --label upstream-drift --state open --json number --jq '.[0].number // empty')
          if [ "$STALE" = "true" ]; then
            {
              echo "One or more pinned upstreams have moved. Checked $(date -u +%Y-%m-%d) ([run]($RUN_URL))."
              echo
              cat report.md
              echo
              if [ -n "$PR_URL" ]; then
                echo "**Bump PR: $PR_URL**. Review the changelog and any warnings there, then merge."
              else
                echo "**No bump PR was produced; see the [run]($RUN_URL).**"
              fi
              echo "See CONTRIBUTING.md → Upgrade runbook."
              echo
              echo "_This issue is maintained by the upstream-check workflow and closes itself once every pin is current._"
            } > body.md
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file body.md
            else
              gh issue create --title "Upstream drift: pinned workspaces are behind" \
                --label upstream-drift --body-file body.md
            fi
          else
            # Master is current (e.g. a maintainer bumped by hand): retire any
            # leftover automated PR and branch.
            stale_pr=$(gh pr list --head upstream-bump --state open --json number --jq '.[0].number // empty')
            if [ -n "$stale_pr" ]; then
              gh pr close "$stale_pr" --delete-branch --comment "Superseded: master is current as of $(date -u +%Y-%m-%d)."
            elif git rev-parse -q --verify refs/remotes/origin/upstream-bump >/dev/null; then
              git push origin --delete upstream-bump
            fi
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "All pinned upstreams are current as of $(date -u +%Y-%m-%d) ([run]($RUN_URL))."
            fi
          fi

      # The live registry should still hold together at its current pins
      # (catches upstream force-pushes or deleted tags under a pinned ref).
      # Runs last so a broken pin never blocks the bump PR that would fix it.
      - name: Validate registry at current pins
        if: always() && steps.check.outcome == 'success'
        run: git checkout -q -f master && python3 scripts/regen-registry.py validate

      # A scheduled run that could not open its PR must be red, not green
      # with an annotation nobody reads.
      - name: Fail if the bump PR could not be produced
        if: steps.pr.outputs.failed == 'true'
        run: exit 1
